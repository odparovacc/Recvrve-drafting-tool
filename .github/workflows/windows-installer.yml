# Builds Recvrve for Windows and its setup program.
#
# - Run it by hand from the Actions tab ("Run workflow"): the setup is attached to the run
#   as an artifact.
# - Push a tag like v0.2.1: the setup is also attached to a GitHub release for that tag.
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: cargo build --release --locked

      - name: Read the version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1
          "version=$($line.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      # The licenses of everything the exe contains, from Cargo.lock, for the setup to
      # install next to it.
      - name: Write the third-party notices
        run: python tools/third_party_notices.py THIRD-PARTY-NOTICES.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the setup program
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\recvrve.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Recvrve-${{ steps.version.outputs.version }}-beta-setup
          path: target/installer/*.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/installer/*.exe
          prerelease: true
